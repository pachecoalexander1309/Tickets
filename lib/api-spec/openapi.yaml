openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Ticketmaster event discovery
  - name: tickets
    description: Sandbox ticket comparison
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /events/search:
    get:
      operationId: searchEvents
      tags: [events]
      summary: Search Ticketmaster events
      description: Searches live events through the server-side Ticketmaster Discovery API integration.
      parameters:
        - name: keyword
          in: query
          required: true
          description: Event, artist, team, or venue to search for
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Matching events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ticketmaster request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/compare:
    get:
      operationId: compareTickets
      tags: [tickets]
      summary: Compare sandbox ticket listings
      description: Discovers matching marketplace event URLs and captures sandbox ticket listings through Tickets.dev.
      parameters:
        - name: eventUrl
          in: query
          required: true
          description: Ticketmaster event URL selected by the user
          schema:
            type: string
            minLength: 1
            maxLength: 2000
        - name: eventName
          in: query
          required: true
          description: Event name used to match equivalent marketplace listings
          schema:
            type: string
            minLength: 1
            maxLength: 240
        - name: eventDate
          in: query
          required: false
          description: Local event date used to improve marketplace matching
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Normalized sandbox ticket listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketComparison"
        "400":
          description: Invalid event selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Tickets.dev request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Event:
      type: object
      required:
        - id
        - name
        - date
        - venue
        - city
        - url
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
        time:
          type: ["string", "null"]
        venue:
          type: string
        city:
          type: string
        url:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    TicketListing:
      type: object
      required:
        - id
        - marketplace
        - section
        - row
        - quantity
        - ticketPrice
        - fees
        - totalPrice
        - currency
        - url
      properties:
        id:
          type: string
        marketplace:
          type: string
        section:
          type: string
        row:
          type: string
        quantity:
          type: number
        ticketPrice:
          type: number
        fees:
          type: number
        totalPrice:
          type: number
        currency:
          type: string
        url:
          type: ["string", "null"]
    TicketComparison:
      type: object
      required:
        - eventName
        - eventDate
        - venue
        - city
        - currency
        - demoData
        - listings
      properties:
        eventName:
          type: string
        eventDate:
          type: string
        venue:
          type: string
        city:
          type: string
        currency:
          type: string
        demoData:
          type: boolean
        listings:
          type: array
          items:
            $ref: "#/components/schemas/TicketListing"

